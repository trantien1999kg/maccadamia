<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" fill="none">
  <!-- Nền footer: hình nguyên tử (gợi logo WEA) rất mờ ở góc trái trên -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="c" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#60A5FA" stop-opacity=".28"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(150 150)" stroke="url(#g)" stroke-width="6">
    <ellipse rx="230" ry="88" transform="rotate(-28)"/>
    <ellipse rx="230" ry="88" transform="rotate(32)"/>
    <ellipse rx="230" ry="88" transform="rotate(92)"/>
  </g>
  <circle cx="150" cy="150" r="70" fill="url(#c)"/>
  <circle cx="150" cy="150" r="22" fill="#93C5FD" fill-opacity=".22"/>
  <circle cx="92" cy="182" r="24" fill="#BFDBFE" fill-opacity=".45"/>
  <circle cx="352" cy="64" r="10" fill="#BFDBFE" fill-opacity=".4"/>
</svg>
